name: CI

on:
  # Pushes only on master; every other branch is covered by its pull request,
  # so a PR branch does not run CI twice.
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Newer runs of the same pull request cancel older ones. A master run that has
# started is never cancelled (cancel-in-progress is true only for pull_request
# events), but a newer master push still replaces one that is queued.
# Master pushes group by ref, PRs by PR number, so the two never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build, type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # package.json engines require >=22.12.0 (also required by astro 7).
          node-version: "^22.23.3"
          cache: npm
          # The lockfile lives at the repository root (npm workspace: project).
          cache-dependency-path: package-lock.json

      # Workspace install: must run at the repository root, where the lockfile is.
      - name: Install dependencies
        run: npm ci

      # Fails on any high or critical advisory in the installed tree. Dev
      # dependencies are deliberately included (no --omit=dev). This is a
      # static site, so every package runs only on this build runner, and the
      # devDependencies (prettier, typescript, @astrojs/check,
      # prettier-plugin-astro) gate what ships. astro, sharp and vite (a
      # transitive dependency) are runtime dependencies in the lockfile, so
      # --omit=dev would audit them anyway.
      # Result is point-in-time; the advisory database changes daily.
      - name: Audit dependencies (high or critical)
        run: npm audit --audit-level=high

      # Fails (exit 1) if a baselined Linux binary lockfile entry loses its
      # "libc" field (npm 10.9.8 drops it; R-074), is no longer a plain object,
      # or has a different libc value (for example glibc to musl), per
      # scripts/lockfile-libc-baseline.json. A baselined package that is gone
      # from the lockfile is only a notice. Exit 2 if no baseline entry is in
      # the lockfile or an input is unusable.
      - name: Check lockfile libc fields
        run: npm run check:lockfile-libc

      # Existing project script: `prettier --check .` (no eslint in the repo).
      - name: Lint (prettier check)
        working-directory: project
        run: npm run lint

      - name: Build
        working-directory: project
        run: npm run build

      - name: Type check (astro check)
        working-directory: project
        run: npm run check

      - name: Test (unit)
        working-directory: project
        run: npm run test:unit

      - name: Test (integration)
        working-directory: project
        run: npm run test:integration

      - name: Test (functional)
        working-directory: project
        run: npm run test:functional

      - name: Test (smoke)
        working-directory: project
        run: npm run test:smoke

      - name: Test (regression)
        working-directory: project
        run: npm run test:regression

      - name: Test (acceptance)
        working-directory: project
        run: npm run test:acceptance

      - name: Test (security)
        working-directory: project
        run: npm run test:security

      - name: Test (ui)
        working-directory: project
        run: npm run test:ui

      - name: Test (e2e)
        working-directory: project
        run: npm run test:e2e

      - name: Test (performance)
        working-directory: project
        run: npm run test:performance
